<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="650" fill="#ffffff" />

  <!-- Row A: User -->
  <rect x="380" y="16" width="400" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="580" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">User</text>
  <text x="580" y="57" text-anchor="middle" font-size="12.5" fill="#000000">paste an image / point at a path, e.g. "segment the lesion in this ultrasound"</text>

  <line x1="580" y1="72" x2="580" y2="106" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row B: DSH agent -->
  <rect x="305" y="108" width="550" height="62" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
  <text x="580" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">DeepSeek Harness agent</text>
  <text x="580" y="151" text-anchor="middle" font-size="12.5" fill="#000000">reads the tool schema and picks the matching MedPlugin tool</text>
  <text x="580" y="166" text-anchor="middle" font-size="11" fill="#555555">(vague prompt? call a classify/report tool first to disambiguate)</text>

  <!-- fan-out from B to Row C (5 boxes) -->
  <g stroke="#000000" stroke-width="1.3">
    <line x1="580" y1="170" x2="105" y2="222" marker-end="url(#arrow)" />
    <line x1="580" y1="170" x2="342" y2="222" marker-end="url(#arrow)" />
    <line x1="580" y1="170" x2="580" y2="222" marker-end="url(#arrow)" />
    <line x1="580" y1="170" x2="818" y2="222" marker-end="url(#arrow)" />
    <line x1="580" y1="170" x2="1055" y2="222" marker-end="url(#arrow)" />
  </g>

  <!-- Row C: modalities -->
  <g font-size="13.5">
    <rect x="10" y="224" width="190" height="58" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
    <text x="105" y="248" text-anchor="middle" font-weight="bold" fill="#000000">X-ray</text>
    <text x="105" y="266" text-anchor="middle" font-size="11" fill="#000000">MAIRA-2 · MedGemma</text>

    <rect x="247" y="224" width="190" height="58" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
    <text x="342" y="248" text-anchor="middle" font-weight="bold" fill="#000000">CT</text>
    <text x="342" y="266" text-anchor="middle" font-size="11" fill="#000000">MedGemma 1.5 · TotalSeg</text>

    <rect x="485" y="224" width="190" height="58" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
    <text x="580" y="248" text-anchor="middle" font-weight="bold" fill="#000000">MRI</text>
    <text x="580" y="266" text-anchor="middle" font-size="11" fill="#000000">MedGemma 1.5 · TotalSeg</text>

    <rect x="723" y="224" width="190" height="58" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
    <text x="818" y="248" text-anchor="middle" font-weight="bold" fill="#000000">Ultrasound</text>
    <text x="818" y="266" text-anchor="middle" font-size="11" fill="#000000">BiomedCLIP</text>

    <rect x="960" y="224" width="190" height="58" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5" />
    <text x="1055" y="248" text-anchor="middle" font-weight="bold" fill="#000000">Retinal (fundus)</text>
    <text x="1055" y="266" text-anchor="middle" font-size="11" fill="#000000">MedGemma</text>
  </g>

  <!-- converge from Row C to a hub point -->
  <g stroke="#000000" stroke-width="1.2">
    <line x1="105" y1="282" x2="580" y2="326" />
    <line x1="342" y1="282" x2="580" y2="326" />
    <line x1="580" y1="282" x2="580" y2="326" />
    <line x1="818" y1="282" x2="580" y2="326" />
    <line x1="1055" y1="282" x2="580" y2="326" />
  </g>
  <circle cx="580" cy="326" r="2.5" fill="#000000" />

  <!-- diverge from hub to Row D (3 boxes) -->
  <g stroke="#000000" stroke-width="1.3">
    <line x1="580" y1="326" x2="200" y2="368" marker-end="url(#arrow)" />
    <line x1="580" y1="326" x2="580" y2="368" marker-end="url(#arrow)" />
    <line x1="580" y1="326" x2="960" y2="368" marker-end="url(#arrow)" />
  </g>

  <!-- Row D: tool library -->
  <g font-size="13.5">
    <rect x="30" y="370" width="340" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
    <text x="200" y="394" text-anchor="middle" font-weight="bold" fill="#000000">Report generation</text>
    <text x="200" y="413" text-anchor="middle" font-size="11" fill="#000000">plain-narrative findings, phrase grounding, longitudinal compare</text>

    <rect x="410" y="370" width="340" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
    <text x="580" y="394" text-anchor="middle" font-weight="bold" fill="#000000">Segmentation</text>
    <text x="580" y="413" text-anchor="middle" font-size="11" fill="#000000">text-prompted (BiomedParse) or fixed organ atlas (TotalSegmentator)</text>

    <rect x="790" y="370" width="340" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
    <text x="960" y="394" text-anchor="middle" font-weight="bold" fill="#000000">Classification</text>
    <text x="960" y="413" text-anchor="middle" font-size="11" fill="#000000">zero-shot label panel (BiomedCLIP)</text>
  </g>

  <line x1="580" y1="430" x2="580" y2="464" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row E: shared runtime -->
  <rect x="180" y="466" width="800" height="58" rx="8" fill="#cce5ff" stroke="#6c8ebf" stroke-width="1.5" />
  <text x="580" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">One shared Python venv</text>
  <text x="580" y="509" text-anchor="middle" font-size="12.5" fill="#000000">skills/_bootstrap.py — every script re-execs into skills/.venv; model weights download on first use</text>

  <line x1="580" y1="524" x2="580" y2="558" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Row F: output -->
  <rect x="130" y="560" width="900" height="78" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5" />
  <text x="580" y="586" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">Structured JSON + preview image(s)</text>
  <text x="580" y="606" text-anchor="middle" font-size="12.5" fill="#000000">attached inline in chat on an image-capable route, or saved under medplugin/previews/ in the session workspace</text>
  <text x="580" y="624" text-anchor="middle" font-size="11" fill="#555555">research candidate, not a diagnostic device — a radiologist reviews every output</text>
</svg>
